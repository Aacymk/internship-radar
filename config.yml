# ----------------------------------------------------------------------------
#  WHERE TO LOOK
# ----------------------------------------------------------------------------
#  Community-maintained lists of internship postings. They are usually the
#  first place a new posting appears.
#
#  To add another list, copy one of these blocks and change the name and url.
#  The url must be the RAW github address (click "Raw" on the README page).
#  "sections" is optional - use it when a list mixes categories and you only
#  want some of them.
# ----------------------------------------------------------------------------
job_lists:
  - name: vanshb03
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/main/README.md

  - name: speedyapply
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md

  - name: SimplifyJobs
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md

  - name: zapplyjobs
    url: https://raw.githubusercontent.com/zapplyjobs/Internships-2027/main/README.md
    sections:
      - software engineering
      - data science


# Set to false to skip checking company careers sites directly and rely
# only on the lists above.
check_boards: true
