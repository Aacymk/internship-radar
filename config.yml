# ============================================================================
#  Internship Radar - settings
# ============================================================================
#  This is the only file you need to edit. You can edit it right here on
#  GitHub: click the pencil icon above, make your changes, then click
#  "Commit changes" at the bottom.
#
#  Two rules to avoid errors:
#    1. Keep the two-space indentation exactly as it is.
#    2. Every company goes on its own line starting with "- ".
# ============================================================================

# Which internship season to track. Change the year each cycle.
season: "Summer 2027"


# ----------------------------------------------------------------------------
#  COMPANIES TO WATCH
# ----------------------------------------------------------------------------
#  You are only told about postings at companies listed here.
#
#  Most companies just need their name:
#      - Netflix
#
#  Some can also be checked against their own careers site directly, which
#  is faster and more reliable than waiting for a list to pick them up. Those
#  entries have a "board" attached. You do not need to add these yourself -
#  see README "Adding a company's job board" if you want to.
# ----------------------------------------------------------------------------
companies:
  # --- checked directly against the company's own careers site ---
  - name: Airbnb
    board: greenhouse
    board_id: airbnb
